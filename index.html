<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Calculator</title>
  <meta name="description" content="A beautiful, modern, responsive calculator built with HTML, CSS and JavaScript." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="grid"></span>
  </div>

  <main class="app">
    <header class="app__header">
      <div class="brand">
        <span class="brand__icon" aria-hidden="true">∑</span>
        <div>
          <h1 class="brand__title">Calculator</h1>
          <p class="brand__subtitle">Fast · Precise · Beautiful</p>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
        <span class="theme-toggle__icon" id="themeIcon">🌙</span>
      </button>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="display" id="display">
        <div class="display__history" id="history" aria-live="polite"></div>
        <div class="display__expression" id="expression" aria-live="polite"></div>
        <div class="display__value" id="result" aria-live="assertive">0</div>
        <div class="display__status" id="status"></div>
      </div>

      <div class="keys" role="group" aria-label="Calculator keys">
        <button class="key key--fn" data-action="clear" aria-label="All clear">AC</button>
        <button class="key key--fn" data-action="backspace" aria-label="Backspace">⌫</button>
        <button class="key key--fn" data-action="percent" aria-label="Percent">%</button>
        <button class="key key--op" data-action="operator" data-value="/" aria-label="Divide">÷</button>

        <button class="key" data-action="number" data-value="7">7</button>
        <button class="key" data-action="number" data-value="8">8</button>
        <button class="key" data-action="number" data-value="9">9</button>
        <button class="key key--op" data-action="operator" data-value="*" aria-label="Multiply">×</button>

        <button class="key" data-action="number" data-value="4">4</button>
        <button class="key" data-action="number" data-value="5">5</button>
        <button class="key" data-action="number" data-value="6">6</button>
        <button class="key key--op" data-action="operator" data-value="-" aria-label="Subtract">−</button>

        <button class="key" data-action="number" data-value="1">1</button>
        <button class="key" data-action="number" data-value="2">2</button>
        <button class="key" data-action="number" data-value="3">3</button>
        <button class="key key--op" data-action="operator" data-value="+" aria-label="Add">+</button>

        <button class="key key--wide" data-action="number" data-value="0">0</button>
        <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="key key--equals" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>

    <section class="extra" aria-label="Extra functions">
      <button class="chip" data-action="sqrt" title="Square root (√)">√</button>
      <button class="chip" data-action="square" title="Square (x²)">x²</button>
      <button class="chip" data-action="reciprocal" title="Reciprocal (1/x)">1/x</button>
      <button class="chip" data-action="negate" title="Negate (±)">±</button>
      <button class="chip" data-action="pi" title="Pi (π)">π</button>
      <button class="chip" data-action="euler" title="Euler's number (e)">e</button>
    </section>

    <footer class="app__footer">
      <p class="hint">
        Keyboard: <kbd>0-9</kbd> <kbd>.</kbd> <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd>
        <kbd>Enter</kbd> <kbd>Backspace</kbd> <kbd>Esc</kbd> <kbd>%</kbd> <kbd>r</kbd>√ <kbd>s</kbd>x²
      </p>
      <p class="credit">Built with HTML · CSS · JavaScript</p>
    </footer>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
